<title>Thank you — Kameela Abdi</title>
<link rel="stylesheet" href="style.css?v=ocean-1">
<style>
  * { box-sizing:border-box; }
  body.confirmation {
    margin:0; min-height:100svh; display:grid; place-items:center; padding:28px;
    color:#f3faff; font-family:var(--font-body);
    background:linear-gradient(135deg,#071c3899,#0a234acc),url('images/ocean-depth.webp') center/cover,#061a35 !important;
  }
  .confirmation main {
    width:min(100%,520px); padding:clamp(26px,6vw,44px); border-radius:24px;
    background:#102f50df; border:1px solid #a2dbff5c;
    box-shadow:inset 0 1px 0 #effbff2e,0 20px 56px #010e274d;
  }
  @supports ((backdrop-filter:blur(16px)) or (-webkit-backdrop-filter:blur(16px))) {
    .confirmation main { background:#1033538c; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  }
  .confirmation h1 { margin:0; color:#f4fbff; font:650 clamp(40px,7vw,56px)/1.05 var(--font-body); letter-spacing:-.05em; }
  .confirmation p { margin:18px 0; font-size:15px; line-height:1.65; color:#d9edfc; }
  .confirmation a { display:inline-block; padding:12px 0; color:#a8e1ff; text-decoration:underline; text-underline-offset:5px; }
</style>
</head>
<body class="confirmation">
<main>
<h1>Thanks for reaching out.</h1>
<p>Your message has been submitted. I look forward to connecting.</p>
<a href="./index.html#contact">Back to my portfolio</a>
</main>
</body>
